<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — GradeEscolar</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1B3F7A 0%, #2E6DB4 60%, #4A90D9 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 48px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.25);
  }
  .logo {
    text-align: center;
    margin-bottom: 32px;
  }
  .logo-icon {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, #1B3F7A, #2E6DB4);
    border-radius: 16px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 28px; margin-bottom: 12px;
  }
  .logo h1 { font-size: 22px; color: #1B3F7A; font-weight: 700; }
  .logo p  { font-size: 13px; color: #888; margin-top: 4px; }

  label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
  input[type=email], input[type=password] {
    width: 100%; padding: 12px 14px; border: 1.5px solid #ddd;
    border-radius: 8px; font-size: 14px; transition: border .2s;
    outline: none;
  }
  input:focus { border-color: #2E6DB4; }
  .field { margin-bottom: 20px; }
  .btn {
    width: 100%; padding: 13px; background: linear-gradient(135deg, #1B3F7A, #2E6DB4);
    color: #fff; border: none; border-radius: 8px; font-size: 15px;
    font-weight: 600; cursor: pointer; transition: opacity .2s;
  }
  .btn:hover { opacity: .9; }
  .error { background: #fff0f0; color: #c0392b; border: 1px solid #f5c6c6;
    padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
  .demo { margin-top: 24px; padding: 14px; background: #f0f5ff; border-radius: 8px;
    font-size: 12px; color: #555; line-height: 1.7; }
  .demo strong { color: #1B3F7A; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">📅</div>
    <h1>GradeEscolar</h1>
    <p>Sistema de Gerenciamento de Horários</p>
  </div>
  <div class="error" id="errMsg"></div>
  <div class="field">
    <label>E-mail</label>
    <input type="email" id="email" placeholder="usuario@escola.com" value="admin@escola.com">
  </div>
  <div class="field">
    <label>Senha</label>
    <input type="password" id="senha" placeholder="Sua senha" value="admin123">
  </div>
  <button class="btn" onclick="login()">Entrar</button>
  <div class="demo">
    <strong>Acessos de demonstração:</strong><br>
    ADM: admin@escola.com / admin123<br>
    Prof: carlos@escola.com / carlos123<br>
    Coord: coord@escola.com / coord123
  </div>
</div>
<script>
async function login() {
  const email = document.getElementById('email').value;
  const senha = document.getElementById('senha').value;
  const err   = document.getElementById('errMsg');
  err.style.display = 'none';
  const r = await fetch('/api/login', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({email, senha})
  });
  if (r.ok) { window.location = '/dashboard'; }
  else {
    err.textContent = 'E-mail ou senha incorretos.';
    err.style.display = 'block';
  }
}
document.addEventListener('keydown', e => { if(e.key==='Enter') login(); });
</script>
</body>
</html>
