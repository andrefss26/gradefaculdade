<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GradeEscolar — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b1120;--card:#131d30;--border:#1e2e47;--accent:#3b82f6;--accent2:#60a5fa;--text:#e2e8f0;--muted:#64748b;--success:#22c55e;--danger:#ef4444}
body{font-family:'DM Sans',sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bg-grid{position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:40px 40px;opacity:.3;pointer-events:none}
.glow{position:fixed;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.15) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:48px 40px;width:100%;max-width:420px;box-shadow:0 25px 60px rgba(0,0,0,.5)}
.logo{text-align:center;margin-bottom:32px}
.logo-icon{font-size:42px;display:block;margin-bottom:10px}
.logo-title{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:var(--text);letter-spacing:-0.5px}
.logo-sub{font-size:13px;color:var(--muted);margin-top:4px}
.field{margin-bottom:20px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.field input{width:100%;background:#0f1827;border:1.5px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;transition:border-color .2s,box-shadow .2s;outline:none}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),#2563eb);border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:transform .15s,box-shadow .15s;margin-top:8px}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(59,130,246,.4)}
.btn:active{transform:translateY(0)}
.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:10px 14px;font-size:13px;color:#fca5a5;margin-bottom:16px;display:none}
.demo{margin-top:24px;border-top:1px solid var(--border);padding-top:20px}
.demo-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
.demo-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11px;padding:4px 10px;border-radius:20px;background:#1e2e47;border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--accent);color:var(--accent2);background:rgba(59,130,246,.1)}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="glow"></div>
<div class="card">
  <div class="logo">
    <span class="logo-icon">📅</span>
    <div class="logo-title">GradeEscolar</div>
    <div class="logo-sub">Sistema de Gestão de Horários</div>
  </div>
  <div class="err" id="err"></div>
  <div class="field">
    <label>E-mail</label>
    <input type="email" id="email" placeholder="seu@email.com" autocomplete="username">
  </div>
  <div class="field">
    <label>Senha</label>
    <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">
  </div>
  <button class="btn" onclick="login()">Entrar no sistema</button>
  <div class="demo">
    <div class="demo-title">Acessos de demonstração</div>
    <div class="demo-chips">
      <span class="chip" onclick="fill('admin@escola.com','admin123')">👑 Admin</span>
      <span class="chip" onclick="fill('carlos@escola.com','carlos123')">👨‍🏫 Professor</span>
      <span class="chip" onclick="fill('coord@escola.com','coord123')">🎓 Coordenador</span>
    </div>
  </div>
</div>
<script>
function fill(e,s){document.getElementById('email').value=e;document.getElementById('senha').value=s}
document.addEventListener('keydown',e=>{if(e.key==='Enter')login()})
async function login(){
  const email=document.getElementById('email').value.trim()
  const senha=document.getElementById('senha').value
  const err=document.getElementById('err')
  err.style.display='none'
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,senha})})
    const d=await r.json()
    if(d.ok) window.location.href='/dashboard'
    else{err.textContent=d.msg||'Credenciais inválidas.';err.style.display='block'}
  }catch(e){err.textContent='Erro de conexão.';err.style.display='block'}
}
</script>
</body>
</html>
